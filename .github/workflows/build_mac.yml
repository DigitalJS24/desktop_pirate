name: Build macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6 Pillow pyinstaller

      - name: Generate assets
        run: |
          python3 sprite_generator.py
          python3 parrot_sprite_generator.py
          python3 piratess_sprite_generator.py
          python3 minion_sprite_generator.py

      - name: Build macOS .app with PyInstaller
        run: |
          pyinstaller \
            --name "DesktopPirate" \
            --windowed \
            --onedir \
            --osx-bundle-identifier "com.desktop.pirate" \
            --add-data "assets:assets" \
            --icon "assets/sprites/idle_right_0.png" \
            --clean \
            main.py

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r DesktopPirate-macOS.zip DesktopPirate.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPirate-macOS
          path: dist/DesktopPirate-macOS.zip
